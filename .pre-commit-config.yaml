repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: .venv/bin/python -m codespell_lib
        language: system
        types: [text]
