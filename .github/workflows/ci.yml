name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: .venv/bin/python -m ruff check --no-fix .
      - run: .venv/bin/python -m ruff format --check .
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python -m codespell_lib

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: .venv/bin/python -m pytest

  # the checks every release gets in the catalog: the manifest, the requirements against a
  # channel and loading the provider in the server image of that channel
  catalog:
    name: Catalog checks
    uses: music-assistant/community-catalog/.github/workflows/check-provider.yml@main
    with:
      folder: livephish
      channel: nightly
